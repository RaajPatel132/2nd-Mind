# Every push and PR: commit messages and authors, backend (lint, types, boundaries, OpenAPI snapshot, unit +
# integration tests, audit), frontend (lint, types, build, client drift, audit), secrets, infra
# (Terraform format, validate, tflint, trivy, offline tests), image scan and push, and the E2E smoke
# against the compose stack. Jobs call the same make targets as local. On a push to main (and a
# sprint branch, once DEPLOY_SPRINT_BRANCHES is true) a green run deploys, through deploy.yml.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.7"
  NODE_VERSION: "24"

jobs:
  commits:
    name: commit messages and authors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: commitlint
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          from="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            from="HEAD~1"
          fi
          npx --no -- commitlint --from "$from" --to HEAD --verbose
          echo "from=$from" >> "$GITHUB_OUTPUT"
        id: range
      - name: commit authors are on the allowlist (the owner; COMMIT_AUTHORS overrides)
        env:
          COMMIT_AUTHORS: >-
            ${{ vars.COMMIT_AUTHORS
            || 'raj@atliq.com,59522893+RaajPatel132@users.noreply.github.com' }}
        run: scripts/check-commit-authors.sh "${{ steps.range.outputs.from }}" HEAD

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: ruff (lint + format)
        run: make -C .. lint
      - name: mypy --strict
        run: make -C .. typecheck
      - name: import boundaries
        run: make -C .. imports
      - name: OpenAPI snapshot is up to date
        run: make -C .. openapi-check
      - name: unit tests
        run: make -C .. test
      - name: integration tests (testcontainers Postgres + Redis)
        run: make -C .. test-int
      - name: dependency audit (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/req.txt
          uv run --frozen pip-audit --strict --disable-pip --requirement /tmp/req.txt

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: generated client matches the OpenAPI snapshot
        run: npm run gen-client && git diff --exit-code -- src/api/schema.gen.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: design system (tokens, contrast, bundle budget)
        run: npm run check:design
      - name: dependency audit
        run: npm audit --audit-level=high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  # The images production runs (ADR-0035): linux/arm64, built natively on an arm64 runner and
  # tagged by git SHA, scanned, and, on a push to main or a sprint branch, pushed to GHCR (public
  # packages, the workflow's own token, never overwritten). The host pulls them with no credentials.
  images:
    name: images (linux/arm64, tagged by SHA) + trivy
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: build api/worker and web images
        run: docker compose build api web
      - name: the images are arm64 and carry the SHA tag
        run: |
          for image in secondmind-api secondmind-web; do
            arch=$(docker image inspect "$image:$IMAGE_TAG" --format '{{.Architecture}}')
            echo "$image:$IMAGE_TAG is $arch"; test "$arch" = arm64
          done
      - name: trivy (fail on fixable CRITICAL)
        run: scripts/trivy-scan.sh "secondmind-api:$IMAGE_TAG" "secondmind-web:$IMAGE_TAG"
      - name: push to GHCR (main and sprint branches only)
        if: github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'sprint-'))
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          for image in secondmind-api secondmind-web; do
            target="ghcr.io/$owner/$image:$IMAGE_TAG"
            # A tag is never overwritten: a release is what was built for its SHA, once.
            if docker manifest inspect "$target" >/dev/null 2>&1; then
              echo "$target already exists, not pushed again"
            else
              docker tag "$image:$IMAGE_TAG" "$target"
              docker push "$target"
            fi
          done

  # Terraform, offline: format, validate, tflint, trivy config and the mocked-provider tests. No
  # AWS account is involved. (Once the plan role exists, terraform-plan.yml adds a plan summary.)
  infra:
    name: infra (terraform fmt, validate, test, tflint, trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make infra-check
      - name: the lock files are up to date
        run: git diff --exit-code -- 'infra/terraform/**/.terraform.lock.hcl'

  e2e:
    name: e2e (compose, fake providers)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: start the stack (fake-provider mode)
        env:
          MODEL_PROVIDER_MODE: fake
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: playwright smoke
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 api worker web migrate langfuse-web
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Deploy: after everything above is green, on a push to main, or to a sprint branch while the
  # repository variable DEPLOY_SPRINT_BRANCHES is true (the site is behind the access code until
  # S5 launches it; then only main deploys). It waits for the images job, which pushes them.
  deploy:
    name: deploy
    needs: [commits, backend, frontend, secrets, infra, images, e2e]
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main'
      || (startsWith(github.ref, 'refs/heads/sprint-') && vars.DEPLOY_SPRINT_BRANCHES == 'true'))
    permissions:
      contents: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy.yml
