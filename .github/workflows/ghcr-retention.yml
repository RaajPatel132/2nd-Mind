# Keep the last 20 versions of each image on GHCR (a rollback can reach 20 releases back), and
# delete the rest. The packages are public and linked to this repository, so the workflow's own
# token may delete their versions.
name: ghcr-retention

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prune:
    name: keep the last 20 image versions
    runs-on: ubuntu-latest
    steps:
      - name: delete older versions
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          KEEP: "20"
        run: |
          for package in secondmind-api secondmind-web; do
            versions="$(gh api --paginate "users/$OWNER/packages/container/$package/versions" \
              --jq '.[] | [.id, .created_at] | @tsv' 2>/dev/null | sort -k2 -r || true)"
            [ -n "$versions" ] || { echo "$package: no versions (or not published yet)"; continue; }
            echo "$versions" | tail -n +$((KEEP + 1)) | while read -r id created; do
              echo "$package: deleting version $id from $created"
              gh api -X DELETE "users/$OWNER/packages/container/$package/versions/$id"
            done
          done
