# Publish the page of every committed live eval run (`make eval-site`) with GitHub Pages, and the
# two badge files the README shows (the newest recall run, and the unit tests' coverage). It has no
# secrets and no server: the page comes from the run files, the coverage from the unit tests.
# Nothing happens until Pages is switched on (Settings > Pages > Source: GitHub Actions) and the
# repository variable PAGES_ENABLED is `true`; "Run workflow" publishes once by hand whatever the
# variable says.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.7"

jobs:
  build:
    name: build the eval page
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: unit-test coverage
        working-directory: backend
        run: uv run --frozen pytest tests/unit -q --cov --cov-report=json
      - name: render the page and the badge files
        run: >-
          uv run --project backend --frozen python -m secondmind.evals site
          --out _site --repo "${{ github.repository }}" --coverage backend/coverage.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
