# The recall fixture (S3.1): one synthetic workspace every recall test and demo runs on.
# now = Tue 2026-10-06 10:00 Asia/Kolkata. All people, places and titles are invented; nothing
# here is about payments. Times are local (the workspace timezone) unless they end in Z.
#
# The loader writes every entity, item, link and relation through MemoryWriter as ONE system
# turn (no extract step, so it's deterministic), then renders keys exactly as ingestion would.
# Past turns become stored turns and are indexed into conversation_keys.
#
# Item fields (quote "on" in triggers: YAML reads a bare on as true): kind, subtype, format,
# state (after links are applied), title, text, subject,
# predicate, value, attributes, entities [{entity, role}], category, tags, occurred {start, end,
# precision}, rrule, due {at, precision}, valid_from, mentioned, sensitivity, in_core, triggers.

