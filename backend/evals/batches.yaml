# The spending plan of Sprint 4 (S4.1): each live run labelled LIVE_BATCH=<name> may spend at
# most what is left of its batch's allowance, and a batch that ends up over 125% of it halts
# every later run until the halt is cleared and explained. Totals are in evals/runs/.spend, and
# the sprint's total is LIVE_TOTAL_BUDGET_USD=1.50. Sprint 3.9's plan (B1 to B7 and R, $4.00) is
# in its report; its spend book is archived beside this sprint's as evals/runs/.spend.s3.9.
#
# Every batch runs free on the fake provider first (L0, `--dry-run`, no allowance needed).
# After a fix, re-run only the cases it touched; the response cache serves repeat calls.
batches:
  L1: {allowance_usd: 0.10, what: "smoke: 3 link, 2 injection and 2 persona cases"}
  L2: {allowance_usd: 0.45, what: "full: links (13), injection (10), link recall (5), persona (10)"}
  L3: {allowance_usd: 0.20, what: "fixes: the failed cases again, from the cache"}
  L4: {allowance_usd: 0.45, what: "production: smoke-prod three times, the walkthrough, the template's embeddings"}
  R: {allowance_usd: 0.30, what: "reserve: only for a surprise, each use explained in the report"}
