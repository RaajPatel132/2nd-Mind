# Mixed: one message holds a link and a task. The task is saved as usual and the link as a pending
# resource that the worker reads; each has its own item.
id: L13-link-and-task
title: a message with a link and a task saves both
messages: ["remind me to call the plumber on Sunday and read https://tea.example/guide"]
digest:
  title: "A short guide to oolong"
  summary: "How oolong differs from green and black tea, and how to brew it in short hot infusions."
  tags: [tea, oolong]
  cues: [choosing a tea]
model:
  intent: {intent: save, confidence: 0.96, reason: "A task with a reminder, and a link to keep."}
  extract:
    entities:
      - {id: e1, mention: the plumber, name: the plumber, kind: person}
    memories:
      - ref: m1
        kind: task
        subtype: call
        state: open
        title: Call the plumber
        text: Call the plumber on Sunday.
        category: home
        entities: [{entity: e1, role: with}]
        times: [{id: t1, expression: Sunday, clock: due, direction: future}]
        reminder: {lead: on the day}
        modality: asserted
        sensitivity: normal
        importance: 2
        layer: quick
        layer_rationale: A task due soon.
        rationale: A call to make on Sunday, with a reminder.
  enrich:
    memories:
      - ref: m1
        alt: ["Who do I need to call?", "What repair do I need to arrange?", "Who is coming to fix the pipes?"]
        cues: ["when planning the weekend", "when arranging home repairs", "when calling tradespeople"]
expect:
  url: https://tea.example/guide
  status: full
  site: Leaf and Kettle
  chunks_contain: [partly oxidised]
  requests: 1
  reply_contains: ["Saved the link. Reading it now."]
  items: {resource: 1, task: 1}
