id: 39-watched-dark
title: 'Modality: wanting to watch is not having watched'
# Live models answer this better than by abstaining: "You haven't watched Dark yet, it's on
# your wish list". So the case checks that the wish is what gets cited, and never an episode
# of watching it. (The abstain slot moved to 51-kabir-colour.)
question: Have I watched Dark?
shape: exact
gold:
- watch_dark
forbidden:
- watched_severance
model:
  intent:
    intent: recall
    confidence: 0.99
    reason: You’re asking whether I have a saved record that you’ve watched Dark.
  plan:
    sub_queries:
    - shape: exact
      question: Have I watched Dark?
      topic: whether I watched Dark
      about: watching Dark
      entities:
      - mention: Dark
        name: Dark
      filters:
        kinds:
        - episode
        subtypes:
        - watch
  rerank:
  - match: Dark
    score: 0.8
    state: wanted
  - match: Severance
    score: 0.1
  - match: Mindhunter
    score: 0.1
