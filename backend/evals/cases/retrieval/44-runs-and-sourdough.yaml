id: 44-runs-and-sourdough
title: 'Multi-part: one part found, one says it has nothing'
question: How many runs did I log in September, and what did I save about sourdough?
shape:
- count
- semantic
aggregate: [6, 7]
reply_contains:
- I don't have anything saved about sourdough
model:
  intent:
    intent: recall
    confidence: 0.98
    reason: You’re asking me to retrieve your September run count and what you previously saved about sourdough.
  plan:
    sub_queries:
    - shape: count
      question: How many runs did I log in September?
      topic: runs in September
      about: running
      times:
      - expression: in September
        clock: occurred
        direction: past
      filters:
        kinds:
        - episode
        attribute:
          key: activity
          value: run
      aggregate:
        op: count
    - shape: semantic
      question: What did I save about sourdough?
      topic: sourdough
      about: sourdough
      filters:
        kinds:
        - resource
