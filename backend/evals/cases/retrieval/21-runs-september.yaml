id: 21-runs-september
title: Counting with the misfiled runs reported, not counted
question: How many runs did I log in September?
shape: count
gold:
- run_sep_02
- run_sep_27
forbidden:
- run_oct_04
# 6 when the plan counts only logged measurements, 7 when it counts by the activity alone
# (the misfiled run is a run either way); the look-alike offer follows the count.
aggregate: [6, 7]
reply_contains:
- File them as runs?|File it as a run?
model:
  intent:
    intent: recall
    confidence: 0.99
    reason: You’re asking me to retrieve a detail about your logged runs.
  plan:
    sub_queries:
    - shape: count
      question: How many runs did I log in September?
      topic: runs in September
      about: running
      times:
      - expression: in September
        clock: occurred
        direction: past
      filters:
        kinds:
        - episode
        attribute:
          key: activity
          value: run
      aggregate:
        op: count
  rerank:
  - match: along the river
    score: 0.8
  - match: around the lake
    score: 0.8
