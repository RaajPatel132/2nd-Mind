id: 25-save-and-recall
title: "Save and recall: the save happens first, then recall runs on the question"
now: "2026-09-23T10:00"
timezone: Asia/Kolkata
input: Add Dark to my watchlist. What else is on it?
model:
  intent:
    intent: save_and_recall
    confidence: 1.0
    reason: You’re adding Dark to your watchlist and asking what else is already on it.
  extract:
    entities:
    - id: e1
      mention: Dark
      name: Dark
      kind: work
    memories:
    - ref: m1
      kind: intention
      subtype: watch
      state: wanted
      title: Dark
      text: I want to watch Dark.
      category: entertainment/series
      tags:
      - watchlist
      subject: e1
      entities:
      - entity: e1
        role: about
      modality: asserted
      sensitivity: normal
      importance: 3
      layer: archive
      layer_rationale: A watched series intention with no immediate target date goes to archive.
      rationale: This is an intention to watch Dark, a TV series, added to the watchlist.
  enrich:
    memories:
    - ref: m1
      alt:
      - What series do I want to watch?
      - Which show is on my watchlist?
      - What was the German sci-fi series I wanted to see?
      cues:
      - when choosing a show to watch
      - when browsing my watchlist
expect:
  intent: save_and_recall
  memories:
    - match: watch dark
      kind: intention
      subtype: watch
  # Recall itself (listing Dark) is shown on Postgres by the S3.8 integration test; here the
  # ingestion goldens run without a recall store, so the question part finds nothing.
  reply_contains: ["Added Dark to your watch list.", "I don't have anything saved about"]
