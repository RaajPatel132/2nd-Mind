# A secret the pre-check can't see is caught when the model labels it; the turn is redacted.
id: 26-labelled-secret
title: "Model-labelled secret: refused, and the stored turn has the value redacted"
now: "2026-09-23T10:00"
timezone: Asia/Kolkata
input: My gym locker combination is 17-38-02
model:
  intent: {intent: save, confidence: 0.8, reason: "A locker combination."}
  extract:
    memories:
      - ref: m1
        kind: fact
        title: Gym locker combination
        text: My gym locker combination is 17-38-02.
        sensitivity: secret
    secret_spans: ["17-38-02"]
expect:
  not_written: [P-SECRET-1]
  counts: {fact: 0}
  absent: ["17-38-02"]
