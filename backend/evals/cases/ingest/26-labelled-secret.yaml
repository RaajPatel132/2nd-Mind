# A secret the pre-check can't see is caught when the model labels it; the turn is redacted.
id: 26-labelled-secret
title: "Model-labelled secret: refused, and the stored turn has the value redacted"
now: "2026-09-23T10:00"
timezone: Asia/Kolkata
input: The lock on my gym locker opens with 17-38-02
model:
  intent:
    intent: save
    confidence: 1.0
    reason: You shared the combination for your gym locker, which is information to remember.
  extract:
    not_written:
    - what: gym locker combination
      reason: 'secret: locker codes are security credentials that should not be stored in memory'
    secret_spans:
    - 17-38-02
expect:
  not_written: [P-SECRET-1|model]
  counts: {fact: 0}
  absent: ["17-38-02"]
