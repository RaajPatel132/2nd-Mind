# §8.1 (a). All data in these cases is synthetic.
# Golden corrected in R.3 (B2): both live candidates filed this as a task due on the 3rd with
# the default reminder, which is how the recall fixture keeps "Renew passport" too. The PRD's
# "event passport expiry" predates the kinds model; what it asks for still holds: the date,
# the reminder the day before, both stated in the reply. Kind and modality are not pinned
# beyond that (a task may be asserted or planned).
id: 01-passport-reminder
title: "§8.1 (a): a task due the 3rd of next month, with the default reminder the day before"
now: "2026-09-23T10:00"
timezone: Asia/Kolkata
input: Remind me to renew my passport before it expires on the 3rd of next month.
model:
  intent:
    confidence: 0.98
    intent: save
    reason: You’ve asked to remember a reminder to renew your passport before it expires on October 3, 2026.
  extract:
    entities:
    - id: e1
      mention: passport
      name: passport
      kind: thing
    memories:
    - ref: m1
      kind: task
      subtype: renewal
      state: open
      title: Renew passport
      text: I need to renew my passport before it expires on [[t1]].
      category: admin
      tags:
      - passport
      - expiry
      subject: e1
      entities:
      - entity: e1
        role: about
      times:
      - id: t1
        expression: the 3rd of next month
        clock: due
        direction: future
      reminder: {}
      modality: asserted
      sensitivity: normal
      importance: 4
      layer: quick
      layer_rationale: Task with a specific deadline coming up soon, should be in quick layer for timely
        action.
      rationale: A task to renew passport before the stated expiry date. The reminder with default lead
        (day before) ensures the user is prompted before the deadline.
  enrich:
    memories:
    - ref: m1
      alt:
      - when does my passport expire
      - passport renewal reminder
      - renewing my passport before expiration
      cues:
      - when planning my passport renewal
      - when checking what paperwork I need to handle
      - when preparing for international travel
expect:
  memories:
    - match: passport
      kind: task
      state: open
      dates: [{clock: due, value: "2026-10-03", precision: day}]
      layer: quick
      reconcile: new
  triggers: [{match: passport, fires: "2026-10-02T09:00"}]
  reply_contains: ["Sat 3 Oct", "I'll remind you Fri 2 Oct"]
  keys_contain: ["3 October 2026"]
