# A later name attaches to the existing entity as an update, not a second person.
id: 14-person-alias
title: "Person alias: 'my wife Kabir' names the existing 'wife' instead of adding a person"
now: "2026-09-23T10:00"
timezone: Asia/Kolkata
setup:
  - input: My wife loves tulips
    model:
      intent: {intent: save, confidence: 0.9, reason: "A preference."}
      extract:
        entities:
          - {id: e1, mention: My wife, kind: person, label: wife}
        memories:
          - ref: m1
            kind: preference
            title: Wife loves tulips
            text: My wife loves tulips.
            subject: e1
            entities: [{entity: e1, role: about}]
input: My wife Kabir is allergic to lilies
model:
  intent: {intent: save, confidence: 0.9, reason: "A fact about the user's wife."}
  extract:
    entities:
      - {id: e1, mention: My wife, name: Kabir, kind: person, label: wife}
    memories:
      - ref: m1
        kind: fact
        title: Kabir is allergic to lilies
        text: Kabir (my wife) is allergic to lilies.
        category: people/health
        subject: e1
        predicate: allergic_to
        value: {text: lilies}
        entities: [{entity: e1, role: about}]
expect:
  memories:
    - match: lilies
      kind: fact
      predicate: allergic_to
      entities: ["Kabir:about"]
      layer: core
  updated_entities: [Kabir]
  entity_count: 1
