# Fulfil: an episode about something on the wish list fulfils the intention.
id: 06-watched-severance
title: "Fulfil: watching a recommended show marks the wish fulfilled and logs an episode"
now: "2026-09-23T10:00"
timezone: Asia/Kolkata
setup:
  - input: Nisha recommended Severance
    now: "2026-09-18T20:00"
    model:
      intent: {intent: save, confidence: 0.9, reason: "A recommendation to watch."}
      extract:
        entities:
          - {id: e1, mention: Nisha, name: Nisha, kind: person}
          - {id: e2, mention: Severance, name: Severance, kind: work}
        memories:
          - ref: m1
            kind: intention
            subtype: watch
            title: Severance
            text: I want to watch Severance, recommended by Nisha.
            category: entertainment/series
            tags: [series]
            entities: [{entity: e2, role: about}, {entity: e1, role: by}]
input: watched Severance last night, loved it
model:
  intent:
    confidence: 0.99
    intent: save
    reason: You’re sharing that you watched and loved Severance, which is a preference worth remembering.
  extract:
    entities:
    - id: e1
      mention: I
      kind: self
    - id: e2
      mention: Severance
      name: Severance
      kind: work
    memories:
    - ref: m1
      kind: episode
      state: happened
      title: Watched Severance
      text: I watched Severance [[t1]] and loved it.
      category: entertainment/series
      tags:
      - tv
      - watched
      subject: self
      entities:
      - entity: e1
        role: about
      - entity: e2
        role: about
      times:
      - id: t1
        expression: last night
        clock: occurred
        direction: past
      modality: asserted
      sentiment: 2
      sensitivity: normal
      importance: 2
      layer: archive
      layer_rationale: Past episode, archived after completion.
      rationale: An episode of watching Severance with strong positive sentiment (loved it).
  enrich:
    memories:
    - alt:
      - Which show did I love after watching it?
      - What did I watch on Tuesday 22 September 2026?
      - What series should I watch more of?
      cues:
      - when choosing a show to watch
      - when recalling shows I enjoyed
      - when looking for recommendations similar to Severance
      ref: m1
expect:
  memories:
    - match: watched severance
      kind: episode
      state: happened
      dates: [{clock: occurred, value: "2026-09-22T21:00", precision: datetime}]
      entities: ["Severance:about"]
      reconcile: fulfil
  changed:
    - {match: want to watch severance, state: fulfilled}
  diff_ops: [fulfilled]
  counts: {episode: 1, intention: 1}
  reply_contains: ["Marked Severance as watched."]
  keys_contain: ["Watched Severance on Tuesday 22 September 2026, at night. It was on my to-watch list from 18 September 2026, recommended by Nisha."]
