# Per-step model routing (FR-14.2). Switching a step's model is a config change only:
# edit this file, or override from the environment without touching it:
#   MODEL_<STEP>=<provider>:<model>            e.g. MODEL_ANSWER=openai:gpt-6-sol
#   MODEL_<STEP>_FALLBACK=<provider>:<model>   or "none" to disable the fallback
# MODEL_PROVIDER_MODE decides what happens when a provider has no credentials:
#   auto (default): use the step's fallback if it has credentials, else the fake provider
#   live: refuse to start      fake: every step uses the fake provider
# Every routed model needs a price in prices.yaml; start-up fails otherwise.
version: 1

providers:
  anthropic:
    kind: anthropic
    label: Anthropic
    api_key_env: ANTHROPIC_API_KEY
  openai:
    kind: openai
    label: OpenAI
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
  # An OpenAI-compatible server (for example vLLM) registers as one more provider,
  # with no code change (FR-14.7):
  # vllm:
  #   kind: openai
  #   base_url_env: VLLM_BASE_URL
  #   api_key_env: VLLM_API_KEY
  fake:
    kind: fake

# The model picker: what a person can pick for their turns, grouped by provider in this order.
# A pick replaces the model of every chat step in that turn; embeddings keep their route. With
# no credentials for a model's provider, `auto` and `fake` let the fake provider stand in for it
# (priced as that model); `live` shows it as unavailable. Every model needs a price; its weight
# against the baseline in prices.yaml is how fast it uses the quota.
picker:
  default: anthropic:claude-sonnet-5
  models:
    anthropic:claude-fable-5-1: Claude Fable 5.1
    anthropic:claude-opus-5-5: Claude Opus 5.5
    anthropic:claude-opus-5: Claude Opus 5
    anthropic:claude-sonnet-5: Claude Sonnet 5
    anthropic:claude-haiku-4-5: Claude Haiku 4.5
    openai:gpt-6-sol: GPT-6 Sol
    openai:gpt-5.4-mini: GPT-5.4 mini
    openai:gpt-6-luna: GPT-6 Luna

# timeout_s: time allowed to the first token and between streamed chunks (non-streaming:
# the whole call). effort: reasoning depth where the provider supports it.
steps:
  intent:
    provider: anthropic
    model: claude-opus-5
    fallback: openai:gpt-6-sol
    timeout_s: 20
    max_output_tokens: 1024
    effort: low
    prompt: intent@1
  extract:
    provider: anthropic
    model: claude-opus-5
    fallback: openai:gpt-6-sol
    timeout_s: 45
    max_output_tokens: 8192
    effort: medium
    prompt: extract@1
  resolve:
    provider: anthropic
    model: claude-opus-5
    fallback: openai:gpt-6-sol
    timeout_s: 30
    max_output_tokens: 2048
    effort: low
    prompt: resolve@1
  enrich:
    provider: anthropic
    model: claude-opus-5
    fallback: openai:gpt-6-sol
    timeout_s: 30
    max_output_tokens: 2048
    effort: low
    prompt: enrich@1
  # Only for the fuzzy cases the deterministic rules don't settle (S2.8), so a cheaper model.
  reconcile:
    provider: anthropic
    model: claude-sonnet-5
    fallback: openai:gpt-6-sol
    timeout_s: 30
    max_output_tokens: 1024
    effort: low
    prompt: reconcile@1
  plan:
    provider: anthropic
    model: claude-opus-5
    fallback: openai:gpt-6-sol
    timeout_s: 30
    max_output_tokens: 2048
    effort: low
    prompt: plan@1
  # Listwise scores for the top fused candidates of a recall (S3.7): cheap and fast.
  rerank:
    provider: anthropic
    model: claude-haiku-4-5
    fallback: openai:gpt-6-luna
    timeout_s: 20
    max_output_tokens: 2048
    effort: low
    prompt: rerank@1
  # Turns a correction by chat into a target and a change (S3.12).
  correct:
    provider: anthropic
    model: claude-sonnet-5
    fallback: openai:gpt-6-sol
    timeout_s: 30
    max_output_tokens: 1024
    effort: low
    prompt: correct@1
  answer:
    provider: anthropic
    model: claude-opus-5
    fallback: openai:gpt-6-sol
    timeout_s: 30
    max_output_tokens: 4096
    effort: low
    prompt: answer@3
  judge:
    provider: anthropic
    model: claude-opus-5
    fallback: openai:gpt-6-sol
    timeout_s: 60
    max_output_tokens: 2048
    effort: medium
  embed:
    provider: openai
    model: text-embedding-3-small
    timeout_s: 15
