# Per-step model routing (FR-14.2). Switching a step's model is a config change only:
# edit this file, or override from the environment without touching it:
#   MODEL_<STEP>=<provider>:<model>            e.g. MODEL_ANSWER=openai:gpt-6-sol
#   MODEL_<STEP>_FALLBACK=<provider>:<model>   or "none" to disable the fallback
#   EFFORT_<STEP>=none|low|medium|high          a step's reasoning depth
# MODEL_PROVIDER_MODE decides what happens when a provider has no credentials:
#   auto (default): use the step's fallback if it has credentials, else the fake provider
#   live: refuse to start      fake: every step uses the fake provider
# Every routed model needs a price in prices.yaml; start-up fails otherwise.
version: 1

providers:
  anthropic:
    kind: anthropic
    label: Anthropic
    api_key_env: ANTHROPIC_API_KEY
  openai:
    kind: openai
    label: OpenAI
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
  # An OpenAI-compatible server (for example vLLM) registers as one more provider,
  # with no code change (FR-14.7):
  # vllm:
  #   kind: openai
  #   base_url_env: VLLM_BASE_URL
  #   api_key_env: VLLM_API_KEY
  fake:
    kind: fake

# The model picker (ADR-0031). A turn with no pick runs on the routing below, each step on the
# model that suits it: "Auto", the default, for everyone. A person can instead pick one model
# for every chat step of a turn (embeddings keep their route), if their tier allows it. The
# picker shows each model's price for a typical recall turn against Auto's, from the measured
# token profile below. With no credentials for a model's provider, `auto` and `fake` let the
# fake provider stand in for it (priced as that model); `live` shows it as unavailable. Models
# not listed (Fable, the Opus models, GPT-6 Sol) stay priced, so old turns still cost right.
picker:
  models:
    openai:gpt-6-luna: GPT-6 Luna
    openai:gpt-5.4-mini: GPT-5.4 mini
    anthropic:claude-haiku-4-5: Claude Haiku 4.5
    anthropic:claude-sonnet-5: Claude Sonnet 5
  tiers:
    guest: []
    standard: [openai:gpt-6-luna, openai:gpt-5.4-mini, anthropic:claude-haiku-4-5]
    premium:
      - openai:gpt-6-luna
      - openai:gpt-5.4-mini
      - anthropic:claude-haiku-4-5
      - anthropic:claude-sonnet-5
  # Tokens per chat step of a typical recall turn, measured on the recall goldens (R.4).
  typical_turn:
    intent: {input: 720, output: 45}
    plan: {input: 2700, output: 170}
    rerank: {input: 2200, output: 370}
    answer: {input: 990, output: 75}

# Economy routing (R.4, ADR-0031), from measurement: GPT-6 Luna for the structured, short-output
# steps; Claude Haiku 4.5 for extract (it writes memory) and answer (what the person reads);
# GPT-5.4 mini for the rerank (Luna scored the 2-hop and filter-miss cases too low, and mini is
# as fast). Fallbacks cross providers at the same price level: Luna falls back to Haiku, Haiku
# to GPT-5.4 mini, and mini to Haiku, so an outage never makes a turn dearer than the next rung.
#
# timeout_s: time allowed to the first token and between streamed chunks (non-streaming:
# the whole call). effort: reasoning depth where the provider supports it.
steps:
  intent:
    provider: openai
    model: gpt-6-luna
    fallback: anthropic:claude-haiku-4-5
    timeout_s: 20
    max_output_tokens: 512
    effort: none
    prompt: intent@3
  extract:
    provider: anthropic
    model: claude-haiku-4-5
    fallback: openai:gpt-5.4-mini
    timeout_s: 45
    max_output_tokens: 4096
    effort: medium
    prompt: extract@7
  resolve:
    provider: openai
    model: gpt-6-luna
    fallback: anthropic:claude-haiku-4-5
    timeout_s: 30
    max_output_tokens: 1024
    effort: low
    prompt: resolve@1
  enrich:
    provider: openai
    model: gpt-6-luna
    fallback: anthropic:claude-haiku-4-5
    timeout_s: 30
    max_output_tokens: 1024
    effort: low
    prompt: enrich@1
  # Reads a link's page, or text pasted for a link, and writes that one item's title, summary,
  # tags and cue situations (S4.7). The content arrives in a data block and the output schema
  # holds nothing but those fields (S4.8).
  digest:
    provider: openai
    model: gpt-6-luna
    fallback: anthropic:claude-haiku-4-5
    timeout_s: 30
    max_output_tokens: 1024
    effort: low
    prompt: digest@1
  # Only for the fuzzy cases the deterministic rules don't settle (S2.8).
  reconcile:
    provider: openai
    model: gpt-6-luna
    fallback: anthropic:claude-haiku-4-5
    timeout_s: 30
    max_output_tokens: 512
    effort: low
    prompt: reconcile@1
  plan:
    provider: openai
    model: gpt-6-luna
    fallback: anthropic:claude-haiku-4-5
    timeout_s: 30
    max_output_tokens: 1536
    effort: low
    prompt: plan@3
  # Listwise scores for the top fused candidates of a recall (S3.7).
  rerank:
    provider: openai
    model: gpt-5.4-mini
    fallback: anthropic:claude-haiku-4-5
    timeout_s: 20
    max_output_tokens: 1536
    effort: low
    prompt: rerank@3
  # Turns a correction by chat into a target and a change (S3.12).
  correct:
    provider: openai
    model: gpt-6-luna
    fallback: anthropic:claude-haiku-4-5
    timeout_s: 30
    max_output_tokens: 512
    effort: low
    prompt: correct@2
  answer:
    provider: anthropic
    model: claude-haiku-4-5
    fallback: openai:gpt-5.4-mini
    timeout_s: 30
    max_output_tokens: 1500
    effort: low
    prompt: answer@3
  judge:
    provider: openai
    model: gpt-6-luna
    fallback: anthropic:claude-haiku-4-5
    timeout_s: 60
    max_output_tokens: 1024
    effort: medium
  embed:
    provider: openai
    model: text-embedding-3-small
    timeout_s: 15
