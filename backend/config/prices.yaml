# Model prices, USD per 1M tokens (FR-14.5). Bump `version` whenever a price changes: every
# turn records the version it was costed with, so historical costs stay reproducible.
#   input         uncached input tokens
#   cached_input  input tokens served from the provider's prompt cache
#   output        output tokens (includes reasoning / thinking tokens)
# Sources: provider pricing pages as of the version date.
#
# baseline: quota is counted in this model's tokens. Every other model's tokens are charged at
# its weight, (3 x input + output) / the same for the baseline, so a model at twice the price
# uses the allowance twice as fast. The model picker shows each weight next to the model.
version: "2026-09-25"
currency: USD
baseline: anthropic:claude-sonnet-5
models:
  anthropic:
    claude-fable-5-1: { input: 10.00, cached_input: 0.25, output: 50.00 }
    claude-opus-5: { input: 5.00, cached_input: 0.50, output: 25.00 }
    claude-opus-5-5: { input: 4.00, cached_input: 0.20, output: 20.00 }
    claude-sonnet-5: { input: 2.00, cached_input: 0.20, output: 10.00 }
    claude-haiku-4-5: { input: 1.00, cached_input: 0.10, output: 5.00 }
  openai:
    gpt-6-sol: { input: 2.00, cached_input: 0.20, output: 10.00 }
    gpt-6-luna: { input: 0.10, cached_input: 0.01, output: 0.50 }
    gpt-5.4-mini: { input: 0.75, cached_input: 0.075, output: 4.50 }
    text-embedding-3-small: { input: 0.02, cached_input: 0.02, output: 0.00 }
    text-embedding-3-large: { input: 0.13, cached_input: 0.13, output: 0.00 }
  fake:
    # Synthetic prices so the offline fake provider reports a plausible, non-zero cost.
    fake-chat: { input: 1.00, cached_input: 0.10, output: 5.00 }
    fake-embed: { input: 0.02, cached_input: 0.02, output: 0.00 }
