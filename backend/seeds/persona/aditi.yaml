# {day} is the offset from the anchor, and each `vary` list cycles.
series:
  - count: 18
    from_days: -2
    every_days: -3
    vary:
      km: [5, 6, 5.5, 8, 5, 10, 6, 5, 12, 5, 7, 5, 6, 14, 5, 8, 5, 16]
      feel: [an easy pace, it felt hard, my legs were heavy, a steady pace, a little slower than I wanted, a good rhythm]
    item:
      key: run_{n}
      kind: episode
      subtype: run
      title: "Ran {km} km"
      text: "I ran {km} km in the morning, {feel}."
      value: {number: "{km}", unit: km}
      entities: [{entity: cubbon_park, role: at}]
      occurred: {start: "{day}d 06:45", precision: datetime}
      mentioned: "{day}d 08:00"
      category: fitness
      tags: [running]
  - count: 10
    from_days: -5
    every_days: -7
    vary:
      session: [leg day, back and biceps, push day, leg day with squats, core and mobility]
    item:
      key: gym_{n}
      kind: episode
      subtype: workout
      title: "Gym: {session}"
      text: "Gym at Flex: {session}."
      entities: [{entity: flex_gym, role: at}]
      occurred: {start: "{day}d 19:00", precision: datetime}
      mentioned: "{day}d 20:45"
      category: fitness
      tags: [gym]
  - count: 14
    from_days: -1
    every_days: -2
    vary:
      ep_title: [the pilot, the lunch, the trip, the fallout, the wedding, the apology, the rematch]
    item:
      key: lasso_ep_{n}
      kind: episode
      subtype: watch
      title: "Watched Ted Lasso, episode {n}"
      text: "Watched an episode of Ted Lasso with Kabir: {ep_title}."
      entities: [{entity: ted_lasso, role: about}, {entity: kabir, role: with}]
      occurred: {start: "{day}d 22:00", precision: datetime}
      mentioned: "{day}d 23:15"
      category: entertainment/series
  - count: 8
    from_days: -4
    every_days: -11
    vary:
      dish: [dosas, a thali, pasta, wood-fired pizza, momos, a mushroom risotto, chaat, a veg biryani]
      with: [Kabir, Tara, Anika, Zoya, Kabir, Dev, Sameer, Kabir]
    item:
      key: dinner_{n}
      kind: episode
      subtype: meal
      title: "Dinner out: {dish}"
      text: "Went out for {dish} with {with}, and it was worth the wait."
      occurred: {start: "{day}d 20:00", precision: datetime}
      mentioned: "{day}d 22:30"
      category: food/restaurants

# Ten past chats, so the conversation is not empty and "what did you say" has something to find.
turns:
  - key: t_priya_review
    at: "-16d 18:00"
    user: What did Priya say about my last review?
    assistant: "Priya said your last design review was clear but too long. She wants three slides, each with one decision."
  - key: t_sourdough
    at: "-105d 08:20"
    user: Saved the sourdough starter guide
    assistant: Saved the link. Reading it now.
  - key: t_books
    at: "-65d 20:00"
    user: What books would you suggest for a slow weekend?
    assistant: "Since you loved Piranesi, try Klara and the Sun, which is quiet and strange in the same way, or Braiding Sweetgrass if you want something gentler."
  - key: t_gift_tara
    at: "-44d 19:10"
    user: What could I give Tara?
    assistant: "Tara likes plants and green tea. A rubber plant in a terracotta pot and a tin of good green tea would suit her."
  - key: t_where_live
    at: "-300d 10:00"
    user: Where do I live now?
    assistant: You live in Bengaluru. You moved from Pune.
  - key: t_race
    at: "-40d 07:40"
    user: How long should my taper be for the half marathon?
    assistant: "The guide you saved suggests three weeks, cutting your distance by about a fifth each week and keeping one short session at race pace."
  - key: t_passport
    at: "-8d 10:40"
    user: Remind me to renew my passport
    assistant: "Noted. I'll remind you before the Goa flights."
  - key: t_knee
    at: "-9d 09:40"
    user: My knee is sore after the long runs
    assistant: "Noted. I saved that, and I'll keep it in mind when you plan your runs."
  - key: t_noodles
    at: "-18d 12:40"
    user: Sameer wants to try Noodle House 27 after the critique
    assistant: Saved that as something to try with Sameer.
  - key: t_coffee
    at: "-58d 21:10"
    user: Save this pour-over video for Kabir's coffee set
    assistant: Saved the link. Reading it now.
