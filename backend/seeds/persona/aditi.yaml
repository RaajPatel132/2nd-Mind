# The sample persona (S4.10): Aditi Rao, a product designer in Bengaluru. Entirely synthetic: every
# person, place, company, show, book and page here is invented; nothing is about payments or money.
#
# Times are days from the anchor ("-12d 07:30", "+3d"), never calendar dates: a copy of this seed is
# moved to today by whole days (S4.11), so what was upcoming stays upcoming. The text of anything
# that doesn't recur never names a weekday, a date or a relative day ("last week"); the lint tests
# in tests/unit/persona/ enforce that, and the no-payments rule.
#
# now = a Monday, 10:00 Asia/Kolkata. Loaded through MemoryWriter as one system turn (S4.10).
#
# Kabir has no birthday in here on purpose: the suggested save adds it (FR-13.5), and the suggested
# recall ("What could I get Kabir for his birthday?") then uses it with what is already seeded.

