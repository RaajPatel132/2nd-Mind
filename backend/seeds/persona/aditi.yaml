  # ================================================================ saved links, videos and files
  - key: res_sourdough
    kind: resource
    title: A gentle guide to sourdough starters
    text: for the sourdough
    summary: A patient guide to building, feeding and troubleshooting a sourdough starter, with a weekly feeding schedule for a warm kitchen.
    entities: [{entity: sourdough, role: about}]
    mentioned: "-105d 08:00"
    category: hobbies
    tags: [sourdough, baking]
    source:
      kind: link
      url: https://hearthnotes.example/sourdough-starters
      site: Hearth Notes
      author: Leela Nair
      published: "-300d"
      words: 1420
      passages:
        - "A starter is only flour and water that have been left long enough to attract the wild yeast already in your kitchen. For the first week, feed it once a day with equal weights of flour and water, and discard most of what is left before each feeding. It will smell sharp and odd for days, and that is normal."
        - "You will know it is ready when it doubles in size four to six hours after a feeding and the surface is full of small bubbles. A starter that is too runny wants less water; one that has turned grey on top only needs to be stirred back in. A warm shelf above the fridge suits most kitchens."
        - "Once the starter is steady, keep it in the fridge and feed it weekly. Take it out the night before you bake, feed it twice, and use it when it is at its peak. If you forget it for a month, pour off the dark liquid and feed it for three days before trusting it again."
  - key: res_variables
    kind: resource
    title: Designing with variables, a practical guide
    text: for the meetup talk
    summary: How to set up colour, spacing and typography variables with modes, so one design system can switch between themes without copies.
    entities: [{entity: figma_variables, role: about}]
    mentioned: "-28d 11:00"
    category: work
    tags: [figma, design-systems]
    source:
      kind: link
      url: https://pixelandpattern.example/designing-with-variables
      site: Pixel and Pattern
      author: Mohan Reddy
      published: "-60d"
      words: 2310
      passages:
        - "Variables let you name a value once and use it everywhere. Start with primitive variables that hold raw values, such as a grey scale or a spacing step, and then build semantic variables on top that say what a value is for: surface, text, border. Components should only ever refer to the semantic ones."
        - "Modes are where variables earn their keep. A collection can hold a light mode and a dark mode, or a compact and a comfortable density, and every frame can be switched with one click. Keep the number of modes small. Every mode you add is a mode you have to check on every screen."
        - "When you hand over to engineering, export the semantic names, not the raw values. A developer who sees surface.raised knows what to do with it, while a developer who sees a hex code will copy it into three places and lose track of them."
  - key: res_taper
    kind: resource
    title: How to taper for a half marathon
    text: for the race
    summary: A three week taper plan for a half marathon that cuts mileage but keeps some pace work, with advice on the last meal and the morning of the race.
    entities: [{entity: half_marathon, role: about}]
    mentioned: "-40d 07:30"
    category: fitness
    tags: [running, race]
    source:
      kind: link
      url: https://runnersledger.example/taper-half-marathon
      site: Runner's Ledger
      author: Farah Khan
      published: "-150d"
      words: 1660
      passages:
        - "The taper is where the race is won or quietly lost. Over the last three weeks, cut your weekly distance by about a fifth each week, but keep one short session at race pace so your legs remember what it feels like. Most runners who fall apart in the final kilometres trained well and then ran too much in the last fortnight."
        - "Eat normally in the final days. The night before, choose a meal you have eaten before a long run, not a celebratory feast. On the morning, have breakfast two to three hours before the start, and sip water in the last hour rather than gulping it at the line."
        - "Expect to feel strange. Restless legs, a short temper, and a nagging sense that you are losing fitness are all common during a taper. Trust the plan, and save the extra energy for the second half of the race."
