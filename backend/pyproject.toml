[project]
name = "secondmind"
version = "0.1.0"
description = "2nd Mind: a chat-first personal memory with a visible, correctable write policy."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.20",
    "anthropic>=1.8",
    "arq>=0.28",
    "asyncpg>=0.31",
    "fastapi>=0.141",
    "httpx>=0.28",
    "langfuse>=4.15",
    "langgraph>=1.2",
    "openai>=3.19",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1",
    "uvicorn[standard]>=0.53",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3",
    "pip-audit>=2.10",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "testcontainers>=4.15",
    "types-python-dateutil>=2.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondmind"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RET",
    "PT", "TID", "ASYNC", "S", "PERF", "RUF", "PL", "PIE", "ERA",
]
ignore = [
    "PLR0913",  # agent and adapter constructors legitimately take many collaborators
    "PLR2004",  # magic values are fine in tests and HTTP status handling
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "ARG"]
"migrations/**" = ["N999", "S608"]  # DDL built from module constants

[tool.ruff.lint.pylint]
max-branches = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["secondmind"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["secondmind"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config -m 'not live and not integration'"
markers = [
    "integration: needs Docker (testcontainers Postgres and Redis)",
    "live: calls real model providers; needs API keys",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # arq closes its pool with redis-py's deprecated close(); not ours to fix.
    "ignore:Call to deprecated close:DeprecationWarning:arq.worker",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "secondmind"
include_external_packages = true
contract_types = ["public_interface: import_contracts.PublicInterfaceContract"]

[[tool.importlinter.contracts]]
name = "core is a leaf: shared types only, no other secondmind module and no I/O"
type = "forbidden"
source_modules = ["secondmind.core"]
forbidden_modules = [
    "secondmind.api", "secondmind.agent", "secondmind.ingestion", "secondmind.retrieval",
    "secondmind.memory", "secondmind.providers", "secondmind.policy", "secondmind.metering",
    "secondmind.auth", "secondmind.jobs", "secondmind.observability", "secondmind.evals",
    "secondmind.config",
    "fastapi", "starlette", "sqlalchemy", "asyncpg", "alembic", "redis", "arq", "httpx",
    "anthropic", "openai", "langfuse", "langgraph", "structlog", "yaml",
]

[[tool.importlinter.contracts]]
name = "Only api imports the web framework"
type = "forbidden"
source_modules = [
    "secondmind.agent", "secondmind.ingestion", "secondmind.retrieval", "secondmind.memory",
    "secondmind.providers", "secondmind.policy", "secondmind.metering", "secondmind.auth",
    "secondmind.jobs", "secondmind.observability", "secondmind.evals", "secondmind.config",
    "secondmind.core",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Infrastructure SDKs live only in */adapters/ (or api)"
type = "forbidden"
source_modules = [
    "secondmind.agent", "secondmind.ingestion", "secondmind.retrieval", "secondmind.memory",
    "secondmind.providers", "secondmind.policy", "secondmind.metering", "secondmind.auth",
    "secondmind.jobs", "secondmind.observability", "secondmind.evals", "secondmind.config",
]
forbidden_modules = [
    "sqlalchemy", "asyncpg", "alembic", "anthropic", "openai", "redis", "arq", "langfuse",
]
ignore_imports = [
    "secondmind.*.adapters -> sqlalchemy",
    "secondmind.*.adapters.** -> sqlalchemy",
    "secondmind.*.adapters -> asyncpg",
    "secondmind.*.adapters.** -> asyncpg",
    "secondmind.*.adapters.** -> alembic",
    "secondmind.*.adapters.** -> anthropic",
    "secondmind.*.adapters.** -> openai",
    "secondmind.*.adapters -> redis",
    "secondmind.*.adapters.** -> redis",
    "secondmind.*.adapters -> arq",
    "secondmind.*.adapters.** -> arq",
    "secondmind.*.adapters.** -> langfuse",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only memory touches the store port: everything else writes through MemoryWriter"
type = "forbidden"
source_modules = [
    "secondmind.api", "secondmind.agent", "secondmind.ingestion", "secondmind.retrieval",
    "secondmind.providers", "secondmind.policy", "secondmind.metering", "secondmind.auth",
    "secondmind.jobs", "secondmind.observability", "secondmind.evals", "secondmind.config",
    "secondmind.core",
]
forbidden_modules = ["secondmind.memory.store", "secondmind.memory.adapters.store"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modules talk through public interfaces (secondmind.<m> or secondmind.<m>.adapters) only"
type = "public_interface"
root = "secondmind"
public_subpackages = ["adapters"]
# evals is a composition root: it wires the real pipeline to in-memory stores and fake models.
adapter_importers = [
    "secondmind.api", "secondmind.jobs.adapters", "secondmind.evals", "secondmind.*.adapters",
]
