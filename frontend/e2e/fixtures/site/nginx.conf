# The E2E fixture page server: synthetic pages for the link specs, reachable by the api and the
# worker as `fixtures`, and (through network aliases in compose.yaml) as the video hosts, so the
# stack never needs the internet. Test stack only; never part of a release.
server {
    listen 8080;
    server_name _;
    root /srv/site;
    default_type text/html;
    charset utf-8;
    server_tokens off;

    # Any watch?v=... is the one synthetic video.
    location = /watch { try_files /watch.html =404; }
    location / { try_files $uri $uri.html =404; }
}
